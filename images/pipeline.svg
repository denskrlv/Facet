<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect width="960" height="370" rx="12" fill="#FFFFFF"/>

  <!-- Lane 1: fine-tuning -->
  <text x="30" y="30" font-size="13" font-weight="700" fill="#4F46E5" letter-spacing="1">1 · LORA FINE-TUNING</text>

  <g font-size="14" text-anchor="middle">
    <rect x="30" y="42" width="190" height="70" rx="8" fill="#EEF2FF" stroke="#6366F1"/>
    <text x="125" y="72" font-weight="600" fill="#1F2937">CelebA</text>
    <text x="125" y="92" font-size="12" fill="#4B5563">face images + attributes</text>

    <rect x="260" y="42" width="190" height="70" rx="8" fill="#EEF2FF" stroke="#6366F1"/>
    <text x="355" y="72" font-weight="600" fill="#1F2937">Captions</text>
    <text x="355" y="92" font-size="12" fill="#4B5563">gender, smiling, eyeglasses</text>

    <rect x="490" y="42" width="190" height="70" rx="8" fill="#EEF2FF" stroke="#6366F1"/>
    <text x="585" y="72" font-weight="600" fill="#1F2937">GLIDE base (64×64)</text>
    <text x="585" y="92" font-size="12" fill="#4B5563">LoRA r=8 on qkv, c_proj</text>

    <rect x="720" y="42" width="190" height="70" rx="8" fill="#EEF2FF" stroke="#6366F1"/>
    <text x="815" y="72" font-weight="600" fill="#1F2937">Merge adapters</text>
    <text x="815" y="92" font-size="12" fill="#4B5563">glide_faces.pt</text>
  </g>

  <g stroke="#6B7280" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="220" y1="77" x2="258" y2="77"/>
    <line x1="450" y1="77" x2="488" y2="77"/>
    <line x1="680" y1="77" x2="718" y2="77"/>
    <path d="M815,112 V152 H585 V190"/>
  </g>
  <text x="700" y="146" font-size="12" text-anchor="middle" fill="#6B7280">fine-tuned weights</text>

  <!-- Lane 2: compositional sampling -->
  <text x="30" y="180" font-size="13" font-weight="700" fill="#059669" letter-spacing="1">2 · COMPOSITIONAL SAMPLING</text>

  <g font-size="14" text-anchor="middle">
    <rect x="30" y="192" width="190" height="70" rx="8" fill="#ECFDF5" stroke="#10B981"/>
    <text x="125" y="214" font-weight="600" fill="#1F2937">Prompt</text>
    <text x="125" y="234" font-size="12" fill="#4B5563">a woman AND smiling</text>
    <text x="125" y="250" font-size="12" fill="#4B5563">AND NOT glasses</text>

    <rect x="260" y="192" width="190" height="70" rx="8" fill="#ECFDF5" stroke="#10B981"/>
    <text x="355" y="222" font-weight="600" fill="#1F2937">Concept weights</text>
    <text x="355" y="242" font-size="12" fill="#4B5563">explicit or CLIP-derived</text>

    <rect x="490" y="192" width="190" height="70" rx="8" fill="#ECFDF5" stroke="#10B981"/>
    <text x="585" y="222" font-weight="600" fill="#1F2937">Composed guidance</text>
    <text x="585" y="242" font-size="12" fill="#4B5563">ε = ε∅ + Σ wᵢ (εᵢ − ε∅)</text>

    <rect x="720" y="192" width="190" height="70" rx="8" fill="#ECFDF5" stroke="#10B981"/>
    <text x="815" y="214" font-weight="600" fill="#1F2937">GLIDE upsampler</text>
    <text x="815" y="234" font-size="12" fill="#4B5563">64 → 256 px</text>
    <text x="815" y="250" font-size="12" fill="#4B5563">text: concepts joined, no NOT</text>

    <rect x="590" y="296" width="220" height="56" rx="8" fill="#FFF7ED" stroke="#F59E0B" stroke-dasharray="5 4"/>
    <text x="700" y="320" font-weight="600" fill="#1F2937">Attention heatmaps</text>
    <text x="700" y="338" font-size="12" fill="#4B5563">experimental · last stage run</text>
  </g>

  <g stroke="#6B7280" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="220" y1="227" x2="258" y2="227"/>
    <line x1="450" y1="227" x2="488" y2="227"/>
    <line x1="680" y1="227" x2="718" y2="227"/>
  </g>
  <g stroke="#6B7280" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)">
    <path d="M585,262 V279 H650 V294"/>
    <path d="M815,262 V279 H750 V294"/>
  </g>
</svg>
